name: Deploy GitHub Pages

# Manual-only. GitHub Pages is a historical fallback mirror; Cloudflare Workers is
# the automatic production deploy (see deploy-cloudflare.yml). Pages is not enabled
# on this org repo, so an automatic post-CI deploy fails at actions/deploy-pages with
# a 404 ("Ensure GitHub Pages has been enabled"). Keep this workflow_dispatch-only so
# it does not report failed production deploys on every push to main. Before running
# it manually, enable Pages in repo Settings -> Pages.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Project-site path: https://scrimshawlife-ctrl.github.io/Autonomous-Giving-Incorporated/
      # Re-add public/CNAME + drop GITHUB_PAGES_BASE_PATH when cutting DNS/apex to Pages or Vercel.
      - run: GITHUB_PAGES_BASE_PATH=1 npm run build
      - uses: actions/upload-pages-artifact@v5
        with: { path: out }
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
