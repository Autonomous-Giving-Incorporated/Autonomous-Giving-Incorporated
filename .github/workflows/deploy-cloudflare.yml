name: Deploy Cloudflare

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and deploy Workers static assets
        run: |
          npm run cf:build
          npx wrangler deploy --var "FI_WORKER_ORIGIN:$FI_WORKER_ORIGIN" --var "FI_WORKER_ALLOWED_ORIGIN:$FI_WORKER_ALLOWED_ORIGIN"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FI_WORKER_ORIGIN: ${{ vars.FI_WORKER_ORIGIN }}
          FI_WORKER_ALLOWED_ORIGIN: ${{ vars.FI_WORKER_ALLOWED_ORIGIN }}
