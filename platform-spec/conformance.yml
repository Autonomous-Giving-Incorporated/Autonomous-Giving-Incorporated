evidence:
  integration_tests: docs/THREE_REPO_INTEGRATION.md
  notes: >
    Documentation pin to Autonomous Giving Specs v2.0.0 (tag v2.0.0).
    This manifest is not a READY or runtime-conformance claim.
    Money lock: this public site never processes donations; Stripe is
    tenant/SaaS billing only and unused here; gift tracking is third-party
    connectors (P0 every.org) in Portfolio Signals.
    Host lock: Cloudflare + existing Supabase. Render/Fly/Railway/Cloud Run
    are historical or optional only.
    SPEC-023/024/026/027/028 are tracked for this public surface's money,
    connector, loop, and control-plane boundaries — not implemented here.
    CONTRACT-013 ImpactNotice is tracked only; Impact Relay is the producer
    and this site does not produce or consume it at runtime.
